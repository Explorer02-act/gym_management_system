databases:
  - name: gym-management-db
    databaseName: gymdb
    user: gym_user

services:
  - type: web
    name: gym-management-system
    runtime: java
    plan: free
    buildCommand: bash mvnw clean package -DskipTests
    startCommand: java -jar target/GymManagementSystem-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-management-db
          property: connectionString
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BOOTSTRAP_OWNER_USERNAME
        value: owner
      - key: APP_BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_OWNER_ENABLED
        value: true
