spring.application.name=GymManagementSystem
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gymdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rock@02}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.main.log-startup-info=true
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

app.jwt.secret=${APP_JWT_SECRET:qwertyuiokjhgfdsazxcvbnmjhgfdsqwertyuioplkjhgfdsazxdrvgbhh}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.bootstrap-owner.enabled=${APP_BOOTSTRAP_OWNER_ENABLED:true}
app.bootstrap-owner.username=${APP_BOOTSTRAP_OWNER_USERNAME:owner}
app.bootstrap-owner.password=${APP_BOOTSTRAP_OWNER_PASSWORD:password123}
