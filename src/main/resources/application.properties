spring.application.name=GymManagementSystem
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/gymdb
spring.datasource.username=root
spring.datasource.password=rock@02

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.main.log-startup-info=true
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

app.jwt.secret=change-this-secret-to-a-long-random-production-value-at-least-32-chars
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
app.bootstrap-owner.enabled=true
app.bootstrap-owner.username=owner
app.bootstrap-owner.password=password123
